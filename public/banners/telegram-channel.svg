<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title">
  <title id="title">MEMESEAL Casino Telegram channel banner</title>
  <defs>
    <radialGradient id="rg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#003311"/>
      <stop offset="100%" stop-color="#0d0d0d"/>
    </radialGradient>
    <linearGradient id="goldShine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffe666"/>
      <stop offset="50%" stop-color="#fffac8"/>
      <stop offset="100%" stop-color="#ffaa00"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>

  <rect width="1280" height="720" fill="url(#rg)"/>

  <!-- Decorative arc -->
  <circle cx="640" cy="360" r="280" fill="none" stroke="#00ff41" stroke-width="2" opacity="0.3"/>
  <circle cx="640" cy="360" r="360" fill="none" stroke="#00ff41" stroke-width="1" opacity="0.2"/>

  <!-- Glow behind text -->
  <ellipse cx="640" cy="360" rx="500" ry="80" fill="#00ff41" opacity="0.15" filter="url(#glow)"/>

  <!-- Centerpiece -->
  <text x="640" y="200" text-anchor="middle" font-family="Share Tech Mono, monospace" font-size="32" fill="#00ffff" letter-spacing="8">
    /// PLAY · WIN · SHARE ///
  </text>

  <text x="640" y="360" text-anchor="middle" font-family="Orbitron, sans-serif" font-weight="900" font-size="130" fill="url(#goldShine)">
    MEMESEAL
  </text>

  <text x="640" y="440" text-anchor="middle" font-family="Orbitron, sans-serif" font-weight="700" font-size="64" fill="#ff00ff">
    CASINO
  </text>

  <text x="640" y="510" text-anchor="middle" font-family="Share Tech Mono, monospace" font-size="22" fill="#39ff14" letter-spacing="6">
    🐸 DAILY REWARDS · QUESTS · LOTTERY POT · TON STARS 🐸
  </text>

  <!-- Side icons -->
  <text x="120" y="400" font-size="120">🎰</text>
  <text x="1060" y="400" font-size="120">🚀</text>

  <!-- Bottom strip -->
  <rect x="0" y="660" width="1280" height="60" fill="#0d0d0d"/>
  <text x="640" y="700" text-anchor="middle" font-family="Share Tech Mono, monospace" font-size="20" fill="#00ff41">
    Join · Spin · Stack chips · Refer for +200 each
  </text>
</svg>
