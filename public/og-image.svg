  <!-- Top bar -->
  <line x1="64" y1="72" x2="1136" y2="72" stroke="#B8860B" stroke-width="1" opacity="0.4"/>
  <text x="64" y="56" font-family="'Courier New', Courier, monospace" font-weight="700" font-size="13" fill="#B8860B" letter-spacing="5">▲ TRUEST STORY HOLDINGS</text>
