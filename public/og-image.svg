  <!-- TS monogram watermark top right -->
  <text x="1080" y="340" font-family="Georgia, 'Times New Roman', serif" font-weight="900" font-size="220" text-anchor="middle" fill="#B8860B" opacity="0.06">T<tspan font-style="italic">S</tspan></text>
