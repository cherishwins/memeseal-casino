<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <!-- ═══════════════════════════════════════
       VIEWPORT — no zoom lock for mini app
  ═══════════════════════════════════════ -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <!-- ═══════════════════════════════════════
       FAVICON SUITE — favicon to 512px
       Run scripts/generate-brand-icons.mjs
       to build PNG versions from SVG source
  ═══════════════════════════════════════ -->
  <!-- SVG favicon — Chrome, Firefox, Edge, Safari 12+ -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <!-- PNG fallbacks -->
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <!-- Apple devices -->
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <!-- PWA manifest -->
  <link rel="manifest" href="/site.webmanifest" />

  <!-- ═══════════════════════════════════════
       THEME COLORS
  ═══════════════════════════════════════ -->
  <!-- Chrome / Android -->
  <meta name="theme-color" content="#050505" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#050505" />
  <!-- Windows tiles -->
  <meta name="msapplication-TileColor" content="#050505" />
  <meta name="msapplication-TileImage" content="/icon-192x192.png" />

  <!-- ═══════════════════════════════════════
       PRIMARY META
  ═══════════════════════════════════════ -->
  <title>The House · Truest Story Holdings</title>

  <meta name="author" content="Truest Story Holdings" />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://the-house.trueststory.com" />

  <!-- ═══════════════════════════════════════
       OPEN GRAPH — iMessage, Slack, Discord,
       LinkedIn, Facebook, WhatsApp, Telegram
  ═══════════════════════════════════════ -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Truest Story Holdings" />

  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="The House — Truest Story Holdings casino division on Telegram TON" />
  <meta property="og:locale" content="en_US" />

  <!-- ═══════════════════════════════════════
       TWITTER / X CARD
       summary_large_image = full-width card
  ═══════════════════════════════════════ -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:site" content="@trueststory" />
  <meta name="twitter:creator" content="@trueststory" />

  <!-- ═══════════════════════════════════════
       PWA / MOBILE SHELL
  ═══════════════════════════════════════ -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="The House" />
  <meta name="application-name" content="The House" />

       FONTS — preconnect first, then load
       Fraunces: editorial display
       Inter Tight: labels + stats
       IBM Plex Mono: data + tickers
  ═══════════════════════════════════════ -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    rel="stylesheet"
  />

  <!-- Telegram Mini App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- ═══════════════════════════════════════
       CRITICAL CSS — prevents FOUC
       Onyx base before React mounts
  ═══════════════════════════════════════ -->
  <style>
    :root {
      --onyx: #050505;
      --carbon: #0d0d0d;
      --bullion: #B8860B;
      --bullion-bright: #D4A017;
      --bullion-deep: #8B6914;
      --ember: #C73E1D;
      --bone: #E8E2D5;
      --paper: #F0E9D8;
      --mercury: #7A7A7A;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html {
      background: var(--onyx);
      color: var(--bone);
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }
    body {
      margin: 0;
      background: var(--onyx);
      color: var(--bone);
      font-family: "Fraunces", "Times New Roman", Georgia, serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overscroll-behavior: none;
      min-height: 100dvh;
    }
    #root { min-height: 100dvh; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
